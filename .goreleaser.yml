version: 2

builds:
  - main: ./cmd/bifrost
    binary: bifrost
    env: [CGO_ENABLED=0]
    ldflags:
      - -s -w -X github.com/kogungor/bifrost/internal/cli.Version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]


checksum:
  name_template: checksums.txt

release:
  github:
    owner: kogungor
    name: bifrost

homebrew_casks:
  - name: bifrost
    directory: Casks
    binaries:
      - bifrost
    homepage: https://github.com/kogungor/bifrost
    description: Session context bridge between AI coding tools
    repository:
      owner: kogungor
      name: homebrew-bifrost
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
